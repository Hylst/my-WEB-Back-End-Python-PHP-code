<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Nouvelle Entrée</title>
</head>

<body>
    <h1>Ajouter une entrée au Codex</h1>
    <form method="POST">
        <label>Titre : <input type="text" name="titre" required></label><br><br>
        <label>Contenu :<br>
            <textarea name="contenu" rows="10" cols="50" required></textarea>
        </label><br><br>
        <button type="submit">Graver dans la mémoire (RAM)</button>
    </form>
    <br>
    <a href="/">Annuler</a>
</body>

</html>
