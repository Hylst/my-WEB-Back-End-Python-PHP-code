<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice 4 - Contact Guilde</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Bureau des Quêtes</h1>

        <!-- Zone de messages Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="nom">Nom du Héros</label>
                <input type="text" id="nom" name="nom" placeholder="Ex: Gandalf le Gris">
            </div>

            <div class="form-group">
                <label for="message">Description de la Mission</label>
                <textarea id="message" name="message" rows="5"
                    placeholder="Décrivez votre problème de dragon..."></textarea>
            </div>

            <button type="submit">Envoyer la Requête</button>
        </form>
    </div>
</body>

</html>
